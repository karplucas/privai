// Plugin versions are resolved in settings.gradle through pluginManagement.
// The legacy `buildscript { classpath ... }` block that used to live here
// declared a different AGP (8.7.0) and Kotlin (2.3.0) than settings.gradle
// requested (8.11.1 / 2.1.0), which puts two versions of the same plugin on the
// build classpath.

rootProject.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir("../build"))

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name).get())

    if (project.name != 'app') {
        project.evaluationDependsOn(':app')
    }

    // Some plugins still ship with a lower Java target than the app; align them
    // so the whole build agrees on 17.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (project.plugins.hasPlugin('kotlin-android') ||
                    project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
