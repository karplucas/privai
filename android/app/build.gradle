plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// -Pchatterbox.vulkan=true builds the GPU backend into the speech engine.
// See the note in defaultConfig before turning this on by default.
def chatterboxVulkan = (project.findProperty('chatterbox.vulkan') ?: 'false')
        .toString().equalsIgnoreCase('true') ? 'ON' : 'OFF' 

android {
    // Matches the package declared by MainActivity.kt.
    namespace "com.example.privai"
    compileSdk flutter.compileSdkVersion
    ndkVersion "29.0.13113456"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    androidResources {
        // MediaPipe memory-maps .task/.litertlm bundles, so they must not be
        // compressed inside the APK.
        noCompress += ['task', 'litertlm', 'bin', 'onnx', 'gguf']
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }

    defaultConfig {
        applicationId "com.LucasKarpinski.privai"
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        externalNativeBuild {
            cmake {
                // c++_shared because two shared objects (libchatterbox_ffi and
                // libttsbackbone) both need the C++ runtime; static copies
                // would each get their own and break exception handling
                // across the boundary.
                // CHATTERBOX_VULKAN compiles the decode backbone's Vulkan
                // backend, which is what makes the app's GPU switch do
                // anything — without it that switch sets n_gpu_layers on a
                // binary with no GPU backend and silently stays on the CPU.
                //
                // OFF by default, and not merely out of caution: ggml
                // registers and initialises a Vulkan device when the library
                // loads, before anything asks for a GPU. On a device whose
                // Vulkan lacks an extension it wants, that fails and takes the
                // process down — so a Vulkan build crashes even with the
                // in-app switch off. Measured on the emulator, whose
                // passthrough reports no fp16 and no integer dot product:
                // "createDevice: ErrorExtensionNotPresent", then SIGSEGV, on
                // the CPU path.
                //
                // Build one to test on real hardware with:
                //   flutter build apk --debug -Pchatterbox.vulkan=true
                //
                // Shipping it on would need GGML_BACKEND_DL, so the Vulkan
                // backend is a separate object loaded only when the GPU is
                // actually requested.
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DCHATTERBOX_VULKAN=${chatterboxVulkan}"
                cppFlags "-O3", "-fexceptions"

                // 64-bit only. The models need well over 2 GB of address
                // space, and ggml-vulkan does not compile for 32-bit at all:
                // Vulkan's non-dispatchable handles are uint64_t there, which
                // makes Vulkan-Hpp's conversion explicit, and its memory
                // logging streams a vk::Buffer straight to an ostream.
                //
                // This filter, not the `ndk` block below, is what decides
                // which ABIs CMake is invoked for.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "../../native/chatterbox/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // TODO: Replace with a real signing config before publishing.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.mediapipe:tasks-genai:0.10.29'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
