name: privai
description: Flutter app with Gemma AI model

publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The engine is picked from the file extension — .litertlm goes to LiteRT-LM,
  # .task/.bin to MediaPipe — but since 1.0.0 each engine is its own package and
  # core registers none of them, so both are listed below and named in
  # FlutterGemma.initialize() (see lib/main.dart).
  #
  # 1.x is what makes Gemma 4 work. The 0.12 line pinned the litertlm-android
  # AAR at 0.9.0-beta, which is older than the current Gemma 4 .litertlm bundles
  # and fails to build their speculative-decode path; flutter_gemma_litertlm
  # carries a LiteRT-LM 0.14 FFI build instead.
  #
  # Note that build ships arm64 only for Android: .litertlm models cannot run on
  # an x86_64 emulator, so testing them needs a real device. The MediaPipe
  # engine still covers .task/.bin on x86_64.
  flutter_gemma: ^1.4.2
  flutter_gemma_litertlm: ^1.3.1
  flutter_gemma_mediapipe: ^1.0.4
  # Chatterbox and OmniVoice run their ONNX graphs directly; this is also a
  # transitive dependency of kokoro_tts_flutter.
  # ORT 1.23 supports OmniVoice's opset-18 bidirectional attention graph.
  flutter_onnxruntime: ^1.8.3
  whisper_ggml: ^2.4.0
  path_provider: ^2.1.1
  audioplayers: ^5.2.1
  record: ^6.0.0
  kokoro_tts_flutter: ^0.2.1-exp
  http: ^1.1.0
  # Native URLSession/DownloadWorker transfers continue while the app is
  # suspended or the phone is locked.
  background_downloader: ^9.5.7
  flutter_secure_storage: ^9.0.0
  flutter_web_auth_2: ^4.1.0
  intl: ^0.18.1
  permission_handler: ^11.0.1
  # Opens the Hugging Face model page so the user can accept the Gemma terms.
  url_launcher: ^6.2.0
  # PKCE code challenge for the Hugging Face OAuth flow.
  crypto: ^3.0.3
  # Loads OmniVoice's Qwen byte-level BPE vocabulary from tokenizer.json.
  tiktoken: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  rename: ^3.1.0

# whisper_ggml ^2.4.0 above still constrains this to ^2.1.0, so plain
# `pub upgrade` cannot reach the 3.x line. Its usage of the package
# (FFmpegKit.execute, FFmpegSession, ReturnCode in whisper_audio_convert.dart)
# is untouched between 2.1.0 and 3.6.2 per the package changelog, so the
# override is safe.
dependency_overrides:
  ffmpeg_kit_flutter_new_min: ^3.6.2
  # The upstream 2.4.0 iOS reader accesses WAV metadata after teardown and
  # converts already-compatible WAV input through FFmpeg. Keep the patched
  # native source reproducible instead of relying on edits in the Pub cache.
  whisper_ggml:
    path: third_party/whisper_ggml

flutter:
  uses-material-design: true

  # Declared as a directory rather than as individual files on purpose. The
  # Kokoro voice assets (kokoro.onnx, voices.json, tokenizer_vocab.json,
  # lexicon.json) are too large for git and are not tracked, so naming them
  # individually makes `flutter build` fail outright on any checkout that does
  # not have them. A directory entry bundles whatever is present.
  #
  # Required for text-to-speech (see README):
  #   assets/kokoro.onnx             ONNX voice model
  #   assets/voices.json             voice style vectors
  #   assets/tokenizer_vocab.json    phoneme -> token id map
  #   assets/lexicon.json            optional pronunciation overrides
  assets:
    - assets/
